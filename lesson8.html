<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enrollment Form</title>
    <link rel="shortcut icon" href="./favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/lesson8.css">
</head>

<body>
    <main>
        <section class="form-section">
            <h2>Enrollment</h2>
            <form action="/enroll" method="post" id="enrollmentForm" class="form">

                <div class="wrapper-field">
                    <div class="form-field">
                        <label for="surname">Surname:</label>
                        <input type="text" id="surname" name="surname" required>
                    </div>
                </div>

                <div class="wrapper-field">
                    <div class="form-field">
                        <label for="first-name">First name:</label>
                        <input type="text" id="first-name" name="first-name" required>
                    </div>
                </div>

                <div class="wrapper-field">
                    <div class="form-field">
                        <label for="email">Email:</label>
                        <input type="email" id="email" name="email" required>
                    </div>
                </div>

                <div class="wrapper-field">
                    <div class="form-field">
                        <label for="password">Password:</label>
                        <input type="password" id="password" name="password" required>
                    </div>
                </div>

                <div class="wrapper-field">
                    <div class="form-field">
                        <label for="confirm-password">Confirm Password:</label>
                        <input type="password" id="confirm-password" name="confirm-password" required>
                    </div>
                </div>

                <div class="wrapper-field">
                    <div class="form-field">
                        <label for="phone">Phone number:</label>
                        <input type="tel" id="phone" name="phone" required>
                    </div>
                </div>
                
                <div class="wrapper-field">
                    <div class="form-field">
                        <label for="sex">Sex:</label>
                        <input type="radio" id="sex" name="sex" value="male" required>
                        <label for="sex">Male</label>
                        <input type="radio" id="sex" name="sex" value="female" required>
                        <label for="sex">Female</label>
                    </div>
                </div>

                <button type="button" value="Enroll">Enroll</button>
        </section>
    </main>


</body>
</html>
